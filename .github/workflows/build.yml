name: Build HTML5 Game APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Скачивание кода и картинок игры
      uses: actions/checkout@v4

    - name: 2. Настройка Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: 3. Настройка Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 4. Установка Apache Cordova
      run: npm install -g cordova

    - name: 5. Создание проекта Cordova и сборка APK
      run: |
        cordova create mygamefolder com.simulator.game CaseSimulator
        
        # Копируем вообще ВСЕ файлы (index.html и все .jpg картинки) в папку www проекта
        cp -r * mygamefolder/www/ || true
        
        cd mygamefolder
        cordova platform add android
        cordova build android --debug

    - name: 6. Сохранение готового APK в артефакты
      uses: actions/upload-artifact@v4
      with:
        name: CaseSimulator-APK
        path: mygamefolder/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        
