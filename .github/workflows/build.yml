name: Build HTML5 Game APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Скачивание кода игры
      uses: actions/checkout@v4

    - name: 2. Настройка Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 3. Установка Apache Cordova
      run: npm install -g cordova

    - name: 4. Создание проекта Cordova и сборка APK
      run: |
        # Сохраняем index.html во временную папку
        mkdir temp_game
        cp index.html temp_game/index.html
        
        # Создаем проект Cordova прямо в корне (предварительно удалив системные файлы github оттуда, кроме workflow)
        rm -rf index.html README.md
        cordova create . com.simulator.game CaseSimulator
        
        # Возвращаем index.html на место в папку www
        cp temp_game/index.html www/index.html
        
        cordova platform add android
        cordova build android --debug

    - name: 5. Сохранение готового APK в артефакты
      uses: actions/upload-artifact@v4
      with:
        name: CaseSimulator-APK
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
