name: Build HTML5 Game APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Скачивание кода игры
      uses: actions/checkout@v4

    - name: 2. Настройка Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 3. Установка Apache Cordova
      run: npm install -g cordova

    - name: 4. Создание проекта Cordova и сборка APK
      run: |
        # Создаем проект в папке appdir
        cordova create appdir com.simulator.game CaseSimulator
        cd appdir
        cordova platform add android
        # Копируем index.html из корня репозитория в папку www проекта
        cp ../index.html www/index.html
        cordova build android --debug

    - name: 5. Сохранение готового APK в артефакты
      uses: actions/upload-artifact@v4
      with:
        name: CaseSimulator-APK
        path: appdir/platforms/android/app/build/outputs/apk/debug/app-debug.apk
