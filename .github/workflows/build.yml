name: Build HTML5 Game APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Скачивание кода игры
      uses: actions/checkout@v4

    - name: 2. Настройка Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 3. Установка Apache Cordova
      run: npm install -g cordova

    - name: 4. Создание проекта Cordova и сборка APK
      run: |
        # Создаем проект в папке mygamefolder
        cordova create mygamefolder com.simulator.game CaseSimulator
        
        # Копируем index.html из корня репозитория прямо в папку www нового проекта
        cp index.html mygamefolder/www/index.html
        
        # Переходим в папку проекта, добавляем платформу и собираем APK
        cd mygamefolder
        cordova platform add android
        cordova build android --debug

    - name: 5. Сохранение готового APK в артефакты
      uses: actions/upload-artifact@v4
      with:
        name: CaseSimulator-APK
        path: mygamefolder/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        
