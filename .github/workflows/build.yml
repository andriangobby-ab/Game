name: Build HTML5 Game APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Скачивание кода игры
      uses: actions/checkout@v4

    - name: 2. Настройка Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: 3. Настройка Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 4. Установка Apache Cordova
      run: npm install -g cordova

    - name: 5. Сборка проекта
      run: |
        cordova create mygame com.simulator.game CaseSimulator
        cp index.html mygame/www/index.html
        cp *.jpg mygame/www/ || true
        cd mygame
        cordova platform add android
        cordova build android --debug

    - name: 6. Сохранение APK
      uses: actions/upload-artifact@v4
      with:
        name: CaseSimulator-APK
        path: mygame/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        
